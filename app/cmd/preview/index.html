<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AULA RGB · 현재 효과</title><style>:root{color-scheme:dark;font-family:"Segoe UI","Malgun Gothic",sans-serif;background:#101410;color:#eeeee7}*{box-sizing:border-box}main{max-width:1250px;margin:auto;padding:36px 26px}.tag{color:#d9f07f;letter-spacing:.17em;font-size:12px}h1{font-size:36px;letter-spacing:-.04em;font-weight:550}p{color:#a4a69e;font-size:14px;line-height:1.7}button{color:inherit;background:#20251e;border:1px solid #46503d;padding:12px;font:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #d9f07f;outline-offset:4px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:25px 0}.active{background:#d9f07f;color:#18200d}svg{width:100%;height:auto;border:1px solid #48543c;background:#090d0a;padding:20px}.timeline{display:flex;gap:15px;align-items:center;margin-top:24px}input{flex:1;accent-color:#d9f07f}output{font:14px Consolas,monospace}h2{font-size:20px;font-weight:550}</style><main><div class="tag">AULA · CURRENT LIGHT</div><h1>키보드 전체가 함께 반응합니다</h1><p>생명 파동 · 집중 효과 · 흐름 연결 · 밝기 65% · 10fps</p><div class="controls" id="states"></div><h2 id="label"></h2><svg id="keyboard" viewBox="-4 -8 1010 310" role="img" aria-label="F1부터 F12까지 전체 키 효과"></svg><div class="timeline"><button id="play">재생</button><input id="time" type="range" min="0" max="119" value="0" aria-label="재생 시점"><output id="clock"></output></div><p>F키도 현재 효과에 참여합니다. 작업별 F키 상태 표시는 없습니다. 이 미리보기는 USB 장치를 제어하지 않습니다.</p></main><script>const D=/*DATA*/;const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg',items=[];let scene=D.scenes[0],n=20,playing=false,last=performance.now();for(const k of D.keys){let g=document.createElementNS(NS,'g'),r=document.createElementNS(NS,'rect'),t=document.createElementNS(NS,'text');r.setAttribute('x',k.X*42);r.setAttribute('y',k.Y*42);r.setAttribute('width',k.W*42-4);r.setAttribute('height',k.H*42-4);r.setAttribute('rx',4);t.setAttribute('x',(k.X+k.W/2)*42-2);t.setAttribute('y',(k.Y+k.H/2)*42+2);t.setAttribute('text-anchor','middle');t.setAttribute('font-size','8');t.textContent=k.name.toUpperCase().replace('NUM','');g.append(r,t);$('keyboard').append(g);items.push({r,t})}for(const s of D.scenes){const b=document.createElement('button');b.textContent=s.Label;b.dataset.id=s.ID;b.onclick=()=>{scene=s;n=20;draw()};$('states').append(b)}function draw(){items.forEach(({r,t},i)=>{const v=D.frames[scene.ID][n][i],a=v>>16,b=(v>>8)&255,c=v&255;r.setAttribute('fill',`rgb(${a},${b},${c})`);r.setAttribute('stroke','#394031');t.setAttribute('fill',a*.2126+b*.7152+c*.0722>95?'#111810':'#d7dfd0')});for(const b of $('states').children)b.classList.toggle('active',b.dataset.id===scene.ID);$('label').textContent=scene.Label;$('time').max=D.frames[scene.ID].length-1;$('time').value=n;$('clock').textContent=(n/10).toFixed(1)+' / '+(D.frames[scene.ID].length/10).toFixed(1)+'s';$('play').textContent=playing?'일시 정지':'재생'}$('play').onclick=()=>{playing=!playing;last=performance.now();draw()};$('time').oninput=e=>{n=+e.target.value;playing=false;draw()};function loop(now){if(playing&&now-last>=100){const step=Math.floor((now-last)/100);n=(n+step)%D.frames[scene.ID].length;last+=step*100;draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop);</script></html>
